<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wake Word Tester</title>
<style>
  body  { font-family: monospace; background: #111; color: #eee; margin: 0; padding: 30px; }
  #layout { display: flex; gap: 36px; align-items: flex-start; }
  #col-left  { flex: 1 1 0; min-width: 0; }
  #col-right { flex: 1 1 0; min-width: 0; }
  pre   { background: #1a1a1a; padding: 16px; border-radius: 6px; white-space: pre-wrap; }
  h3    { color: #6cf; margin-top: 32px; }
  button { background: #2a6; color: #fff; border: none; border-radius: 5px;
           padding: 8px 18px; font-size: 1em; cursor: pointer; margin-right: 8px; margin-top: 6px; }
  button:disabled { background: #444; cursor: default; }
  button.stop { background: #a33; }

  /* score bar */
  .bar-bg { height: 26px; background: #222; border-radius: 4px; overflow: hidden;
            margin: 8px 0; max-width: 500px; }
  .bar    { height: 100%; width: 0%; background: #2a6; border-radius: 4px;
            transition: width 0.08s linear; }
  .bar.hit { background: #fa3; }

  /* mic detection panel */
  #mic-panel { background: #1a1a1a; border: 1px solid #333; border-radius: 8px;
               padding: 18px 22px; margin-top: 10px;
               display: flex; gap: 28px; align-items: flex-start;
               transition: box-shadow 0.1s; }
  #mic-panel.flash { box-shadow: 0 0 40px 8px #fa3; border-color: #fa3; }
  #mic-left   { flex: 0 0 260px; }
  #mic-wave   { width: 100%; height: 48px; background: #0d0d0d; border-radius: 4px;
                display: block; margin-bottom: 12px; }
  .mic-label  { color: #444; font-size: 0.72em; margin-bottom: 3px; }
  #mic-right  { flex: 1; border-left: 1px solid #2a2a2a; padding-left: 20px;
                min-width: 0; }
  .score-num  { font-size: 2.4em; font-weight: bold; color: #6cf; }
  .detected   { font-size: 1.1em; font-weight: bold; color: #fa3; min-height: 1.5em; margin-top: 4px; }
  #mic-log    { height: 200px; overflow-y: auto; font-size: 0.85em; color: #888; }
  #mic-log .entry { border-bottom: 1px solid #222; padding: 3px 0; }
  #mic-log .entry.hit { color: #fa3; font-weight: bold; }

  /* model status badge */
  .badge { display: inline-block; font-size: 0.75em; padding: 2px 8px;
           border-radius: 10px; vertical-align: middle; margin-left: 10px; }
  .badge.unloaded { background: #333; color: #888; }
  .badge.loaded   { background: #1a3a1a; color: #6f6; }

  /* locked sections */
  .locked { opacity: 0.3; pointer-events: none; user-select: none;
            transition: opacity 0.3s; }
  .unlocked { opacity: 1; pointer-events: auto;
              transition: opacity 0.3s; }

  /* directory table */
  table  { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #333; padding: 5px 10px; }
  th     { background: #1a1a1a; color: #6cf; text-align: left;
           position: sticky; top: 0; z-index: 1; }
  tr.hit td { background: #1a2a1a; }
  .progress  { color: #888; font-size: 0.9em; margin: 6px 0; }
</style>
</head>
<body>
<div id="layout">

<!-- ══ LEFT: model + mic ════════════════════════════════════════════ -->
<div id="col-left">
<h2>Wake Word Tester</h2>

<h3>Load model <span class="badge unloaded" id="model-badge">not loaded</span></h3>
<input type="file" id="model-file" accept=".tflite">
<pre id="out-model">Pick a .tflite file above.</pre>

<div id="section-mic" class="locked">
<h3>Live mic</h3>
<button id="btn-mic-start" disabled>Start mic</button>
<button id="btn-mic-stop" class="stop" disabled>Stop</button>
<div style="margin-top:8px;color:#aaa;font-size:0.9em">
  Threshold:
  <input type="range" id="thr" min="0.1" max="0.99" step="0.01" value="0.5"
         style="width:160px;vertical-align:middle">
  <span id="thr-val">0.50</span>
</div>
<div id="mic-panel">
  <div id="mic-left">
    <div class="mic-label">mic input</div>
    <canvas id="mic-wave"></canvas>
    <div class="mic-label">detection score</div>
    <span class="score-num" id="mic-score">—</span>
    <div class="bar-bg"><div class="bar" id="mic-bar"></div></div>
    <div class="detected" id="mic-detected"></div>
  </div>
  <div id="mic-right">
    <div style="color:#888;font-size:0.85em;margin-bottom:6px">Detection log</div>
    <div id="mic-log"></div>
  </div>
</div>
</div><!-- /section-mic -->
</div><!-- /col-left -->

<!-- ══ RIGHT: wav + directory ═══════════════════════════════════════ -->
<div id="col-right">

<div id="section-wav" class="locked">
<h3>Test WAV file</h3>
<input type="file" id="audio-file" accept=".wav,audio/*">
<button id="btn-test" disabled>Run inference</button>
<pre id="out-test">Pick a WAV file.</pre>
</div>

<div id="section-dir" class="locked">
<h3>Scan directory</h3>
<input type="file" id="dir-input" webkitdirectory>
<button id="btn-scan" disabled>Scan</button>
<div class="progress" id="dir-progress"></div>
<div id="dir-summary"></div>
<div id="dir-scroll" style="max-height:360px;overflow-y:auto;margin-top:8px">
  <table id="dir-table" style="display:none">
    <thead><tr><th>File</th><th>Peak score</th><th>Detected</th><th>Peak at</th></tr></thead>
    <tbody id="dir-tbody"></tbody>
  </table>
</div>
</div>

</div><!-- /col-right -->
</div><!-- /layout -->

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
<script>
tflite.setWasmPath('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/wasm/');
tf.setBackend('cpu');

// ── globals ───────────────────────────────────────────────────────────────────
let model = null;

// ── quant params ──────────────────────────────────────────────────────────────
const IN_SCALE  = 0.10196079;
const IN_ZP     = -128;
const OUT_SCALE = 0.00390625;

// ── microfrontend constants ───────────────────────────────────────────────────
const SR    = 16000;
const WIN   = 480;
const STEP  = 320;
const NFFT  = 512;
const NMELS = 40;

// ── mel filterbank (precomputed) ──────────────────────────────────────────────
const MEL_FB = (() => {
    const hzToMel = hz => 2595 * Math.log10(1 + hz / 700);
    const melToHz = mel => 700 * (10 ** (mel / 2595) - 1);
    const N = NFFT / 2 + 1;
    const melMin = hzToMel(125), melMax = hzToMel(7500);
    const pts  = Array.from({length: NMELS+2}, (_, i) => melMin + i*(melMax-melMin)/(NMELS+1));
    const bins = pts.map(m => Math.floor(melToHz(m) * NFFT / SR));
    return Array.from({length: NMELS}, (_, m) => {
        const f = new Float32Array(N);
        for (let k = bins[m];   k <  bins[m+1]; k++) f[k] = (k-bins[m])   / (bins[m+1]-bins[m]);
        for (let k = bins[m+1]; k <= bins[m+2]; k++) f[k] = (bins[m+2]-k) / (bins[m+2]-bins[m+1]);
        return f;
    });
})();

const HANN = Float32Array.from({length: WIN}, (_, i) => 0.5 - 0.5 * Math.cos(2*Math.PI*i/WIN));

// ── FFT ───────────────────────────────────────────────────────────────────────
function fft(re, im) {
    const n = re.length;
    for (let i=1,j=0; i<n; i++) {
        let bit=n>>1;
        for (; j&bit; bit>>=1) j^=bit;
        j^=bit;
        if (i<j) { let t=re[i]; re[i]=re[j]; re[j]=t; t=im[i]; im[i]=im[j]; im[j]=t; }
    }
    for (let len=2; len<=n; len<<=1) {
        const ang=-2*Math.PI/len, wRe=Math.cos(ang), wIm=Math.sin(ang);
        for (let i=0; i<n; i+=len) {
            let cRe=1, cIm=0;
            for (let j=0,h=len>>1; j<h; j++) {
                const uRe=re[i+j], uIm=im[i+j];
                const vRe=re[i+j+h]*cRe - im[i+j+h]*cIm;
                const vIm=re[i+j+h]*cIm + im[i+j+h]*cRe;
                re[i+j]=uRe+vRe; im[i+j]=uIm+vIm;
                re[i+j+h]=uRe-vRe; im[i+j+h]=uIm-vIm;
                const nr=cRe*wRe-cIm*wIm; cIm=cRe*wIm+cIm*wRe; cRe=nr;
            }
        }
    }
}

// ── single mel frame from a 480-sample window ─────────────────────────────────
function computeMelFrame(win480) {
    const N=NFFT/2+1, re=new Float32Array(NFFT), im=new Float32Array(NFFT);
    for (let i=0; i<WIN; i++) re[i] = win480[i] * HANN[i] * 32768;
    fft(re, im);
    const mel = new Float32Array(NMELS);
    for (let m=0; m<NMELS; m++) {
        let e=0;
        for (let k=0; k<N; k++) e += (re[k]*re[k]+im[k]*im[k]) * MEL_FB[m][k];
        mel[m] = e;
    }
    return mel;
}

// ── raw mel frames for a whole audio buffer ───────────────────────────────────
function rawMelFrames(audio) {
    const frames=[];
    const win=new Float32Array(WIN);
    for (let start=0; start+STEP<=audio.length; start+=STEP) {
        win.copyWithin(0, STEP);
        win.set(audio.subarray(start, start+STEP), WIN-STEP);
        frames.push(computeMelFrame(win));
    }
    return frames;
}

// ── PCAN ──────────────────────────────────────────────────────────────────────
const PCAN_SMOOTH = 1/1024, PCAN_SCALE = 5.0;

function applyPcanFrame(mel, noise) {
    const out = new Float32Array(NMELS);
    for (let c=0; c<NMELS; c++) {
        noise[c] += PCAN_SMOOTH * (mel[c]-noise[c]);
        out[c] = mel[c] / Math.pow(Math.max(noise[c],1e-6), 0.95) * PCAN_SCALE;
    }
    return out;
}

// two-pass version for files (warm noise from clip mean)
function melSpectrogram(audio) {
    const raw   = rawMelFrames(audio);
    const noise = new Float32Array(NMELS);
    for (let c=0; c<NMELS; c++) noise[c] = raw.reduce((s,f)=>s+f[c],0)/raw.length;
    return raw.map(mel => applyPcanFrame(mel, noise));
}

// ── quantize + inference ──────────────────────────────────────────────────────
function quantize(v) { return Math.max(-128, Math.min(127, Math.round(v/IN_SCALE+IN_ZP))); }

const _inferBuf = new Int32Array(3*NMELS);  // reused every call

function inferThreeFrames(f0, f1, f2) {
    for (let c=0; c<NMELS; c++) {
        _inferBuf[c]        = quantize(f0[c]);
        _inferBuf[NMELS+c]  = quantize(f1[c]);
        _inferBuf[2*NMELS+c]= quantize(f2[c]);
    }
    const inp = tf.tensor(_inferBuf, [1,3,NMELS], 'int32');
    const out = model.predict(inp);
    const s = out.dataSync()[0] * OUT_SCALE;
    inp.dispose(); out.dispose();
    return s;
}

function runInference(frames) {
    const scores=[];
    for (let i=2; i<frames.length; i++)
        scores.push(inferThreeFrames(frames[i-2], frames[i-1], frames[i]));
    return scores;
}

// ── WAV loader ────────────────────────────────────────────────────────────────
// One shared AudioContext for decoding — browsers cap how many can be created
let _decodeCtx = null;
async function loadWav(buf) {
    if (!_decodeCtx || _decodeCtx.state === 'closed')
        _decodeCtx = new AudioContext();
    const decoded = await _decodeCtx.decodeAudioData(buf);
    const off = new OfflineAudioContext(1, Math.ceil(decoded.duration*SR), SR);
    const src = off.createBufferSource();
    src.buffer=decoded; src.connect(off.destination); src.start();
    return (await off.startRendering()).getChannelData(0);
}

// ── score timeline string ─────────────────────────────────────────────────────
function timeline(scores) {
    const W=28, step=Math.max(1,Math.floor(scores.length/40));
    let s='\nScore over time:\n';
    for (let i=0; i<scores.length; i+=step) {
        const t=(i*STEP/SR).toFixed(2), v=scores[i];
        s+=`  ${t}s  ${v.toFixed(3)}  [${'█'.repeat(Math.round(v*W))}${'░'.repeat(W-Math.round(v*W))}]\n`;
    }
    return s;
}

// ── waveform display ──────────────────────────────────────────────────────────
const micWaveCanvas = document.getElementById('mic-wave');
const micWaveCtx    = micWaveCanvas.getContext('2d');
const WAVE_LEN = 640;
const micWaveBuf = new Float32Array(WAVE_LEN);  // rolling sample buffer

function drawWaveform(newSamples) {
    // Shift old samples left, append new ones at the end
    const n = Math.min(newSamples.length, WAVE_LEN);
    micWaveBuf.copyWithin(0, n);
    micWaveBuf.set(newSamples.subarray(0, n), WAVE_LEN - n);

    const w = micWaveCanvas.width, h = micWaveCanvas.height;
    micWaveCtx.clearRect(0, 0, w, h);

    // Centre line
    micWaveCtx.strokeStyle = '#1e3a3a';
    micWaveCtx.lineWidth = 1;
    micWaveCtx.beginPath();
    micWaveCtx.moveTo(0, h/2); micWaveCtx.lineTo(w, h/2);
    micWaveCtx.stroke();

    // Waveform — muted teal, clearly different from the green/orange bars
    micWaveCtx.strokeStyle = '#2a7a7a';
    micWaveCtx.lineWidth = 1.5;
    micWaveCtx.beginPath();
    for (let i = 0; i < WAVE_LEN; i++) {
        const x = (i / WAVE_LEN) * w;
        const y = (0.5 - micWaveBuf[i] * 2.5) * h;  // ×2.5 so quiet speech is visible
        i === 0 ? micWaveCtx.moveTo(x, y) : micWaveCtx.lineTo(x, y);
    }
    micWaveCtx.stroke();
}

// ── beep ──────────────────────────────────────────────────────────────────────
function playBeep() {
    try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const g   = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = 880;
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
        osc.start(); osc.stop(ctx.currentTime + 0.18);
    } catch(e) {}
}

// ════════════════════════════════════════════════════════════════════
// 1. MODEL
// ════════════════════════════════════════════════════════════════════
document.getElementById('model-file').onchange = async e => {
    const out=document.getElementById('out-model');
    if (!e.target.files.length) return;
    out.textContent='Loading…';
    try {
        model = await tflite.loadTFLiteModel(await e.target.files[0].arrayBuffer());
        out.textContent = 'Model OK\n' +
            model.inputs.map(t=>`  ${t.name}  ${JSON.stringify(t.shape)}  ${t.dtype}`).join('\n')+'\n'+
            model.outputs.map(t=>`  ${t.name}  ${JSON.stringify(t.shape)}  ${t.dtype}`).join('\n');
        // Unlock all sections
        ['section-wav','section-dir','section-mic'].forEach(id => {
            const el = document.getElementById(id);
            el.classList.remove('locked');
            el.classList.add('unlocked');
        });
        const badge = document.getElementById('model-badge');
        badge.textContent = 'loaded ✓';
        badge.className = 'badge loaded';
        document.getElementById('btn-test').disabled      = !document.getElementById('audio-file').files.length;
        document.getElementById('btn-scan').disabled      = !document.getElementById('dir-input').files.length;
        document.getElementById('btn-mic-start').disabled = false;
    } catch(err) { out.textContent='ERROR: '+err; }
};

// ════════════════════════════════════════════════════════════════════
// 2. SINGLE WAV
// ════════════════════════════════════════════════════════════════════
document.getElementById('audio-file').onchange = e =>
    document.getElementById('btn-test').disabled = !(model && e.target.files.length);

document.getElementById('btn-test').onclick = async () => {
    const out=document.getElementById('out-test');
    out.textContent='Processing…';
    try {
        const audio  = await loadWav(await document.getElementById('audio-file').files[0].arrayBuffer());
        const frames = melSpectrogram(audio);
        const scores = runInference(frames);
        const maxScore=Math.max(...scores), maxIdx=scores.indexOf(maxScore);
        out.textContent =
            `Duration: ${(audio.length/SR).toFixed(2)}s  Frames: ${frames.length}\n`+
            `Peak score: ${maxScore.toFixed(4)} at ${(maxIdx*STEP/SR).toFixed(2)}s  `+
            `(${maxScore>0.5?'DETECTED ***':'not detected'})`+
            timeline(scores);
    } catch(err) { out.textContent='ERROR: '+err; }
};

// ════════════════════════════════════════════════════════════════════
// 3. DIRECTORY SCAN
// ════════════════════════════════════════════════════════════════════
document.getElementById('dir-input').onchange = e =>
    document.getElementById('btn-scan').disabled = !(model && e.target.files.length);

document.getElementById('btn-scan').onclick = async () => {
    const files = Array.from(document.getElementById('dir-input').files)
        .filter(f => f.name.toLowerCase().endsWith('.wav'))
        .sort((a,b) => a.name.localeCompare(b.name));
    if (!files.length) return;
    const tbody=document.getElementById('dir-tbody'), prog=document.getElementById('dir-progress');
    const summary=document.getElementById('dir-summary');
    tbody.innerHTML=''; document.getElementById('dir-table').style.display='table'; summary.textContent='';
    let detected=0;
    for (let i=0; i<files.length; i++) {
        prog.textContent=`${i+1} / ${files.length}  —  ${files[i].name}`;
        try {
            const audio  = await loadWav(await files[i].arrayBuffer());
            const frames = melSpectrogram(audio);
            const scores = runInference(frames);
            const maxScore=Math.max(...scores), maxIdx=scores.indexOf(maxScore);
            const det = maxScore>0.5;
            if (det) detected++;
            const row=tbody.insertRow();
            if (det) row.className='hit';
            row.innerHTML=`<td>${files[i].name}</td>`+
                `<td style="color:${det?'#6f6':'#888'}">${maxScore.toFixed(3)}</td>`+
                `<td>${det?'✓':'✗'}</td>`+
                `<td>${(maxIdx*STEP/SR).toFixed(2)}s</td>`;
        } catch(err) {
            tbody.insertRow().innerHTML=`<td>${files[i].name}</td><td colspan="3" style="color:#a33">ERROR</td>`;
        }
        await new Promise(r=>setTimeout(r,0));
    }
    prog.textContent='';
    summary.textContent=`${detected} / ${files.length} detected  (${(detected/files.length*100).toFixed(0)}%)`;
};

// ════════════════════════════════════════════════════════════════════
// 4. LIVE MIC  — streaming, frame-by-frame like the ESP32
// ════════════════════════════════════════════════════════════════════
const thrSlider = document.getElementById('thr');
thrSlider.oninput = () =>
    document.getElementById('thr-val').textContent = parseFloat(thrSlider.value).toFixed(2);

// Persistent streaming state (reset on Start)
let micCtx=null, micRunning=false;
let micAudioWin   = new Float32Array(WIN);   // 480-sample sliding window
let micNoise      = new Float32Array(NMELS); // PCAN noise estimate
let micF0=null, micF1=null, micF2=null;      // last 3 spectrogram frames
let micScoreBuf   = [0,0,0,0,0];             // 5-frame score smoothing
let micCooldown   = 0;                       // frames remaining in cooldown
let micLeftover   = new Float32Array(0);     // audio samples between callbacks

const COOLDOWN_FRAMES = 100;  // ~2s at 20ms/frame before re-triggering

function micReset() {
    micAudioWin.fill(0);
    micNoise.fill(1e-3);
    micF0=null; micF1=null; micF2=null;
    micScoreBuf = [0,0,0,0,0];
    micCooldown = 0;
    micLeftover = new Float32Array(0);
}

function processStep(step320) {
    // Slide audio window forward by one step
    micAudioWin.copyWithin(0, STEP);
    micAudioWin.set(step320, WIN-STEP);

    // Compute mel frame + PCAN
    const raw  = computeMelFrame(micAudioWin);
    const frame = applyPcanFrame(raw, micNoise);

    // Shift frame deque
    micF0=micF1; micF1=micF2; micF2=frame;
    if (!micF0) return null;

    // Inference
    const raw_score = inferThreeFrames(micF0, micF1, micF2);

    // Smooth
    micScoreBuf.shift(); micScoreBuf.push(raw_score);
    return micScoreBuf.reduce((a,b)=>a+b) / micScoreBuf.length;
}

function updateMicUI(score) {
    if (score === null) return;
    const thr  = parseFloat(thrSlider.value);
    const pct  = Math.min(100, score*100);
    const bar  = document.getElementById('mic-bar');
    const panel= document.getElementById('mic-panel');
    document.getElementById('mic-score').textContent = score.toFixed(4);
    bar.style.width = pct.toFixed(1)+'%';
    bar.className   = 'bar'+(score>=thr?' hit':'');

    if (score >= thr && micCooldown === 0) {
        micCooldown = COOLDOWN_FRAMES;
        const ts = new Date().toLocaleTimeString();
        document.getElementById('mic-detected').textContent = `DETECTED  ${ts}  (${score.toFixed(3)})`;
        // flash panel
        panel.classList.remove('flash');
        void panel.offsetWidth;  // force reflow to restart animation
        panel.classList.add('flash');
        setTimeout(()=>panel.classList.remove('flash'), 600);
        // beep
        playBeep();
        // log
        const log=document.getElementById('mic-log');
        const el=document.createElement('div');
        el.className='entry hit'; el.textContent=`${ts}  score=${score.toFixed(4)}`;
        log.insertBefore(el, log.firstChild);
        while(log.children.length>20) log.removeChild(log.lastChild);
    } else if (score < thr*0.6) {
        document.getElementById('mic-detected').textContent='';
    }
    if (micCooldown>0) micCooldown--;
}

const WORKLET_SRC = `
class MicProcessor extends AudioWorkletProcessor {
    process(inputs) {
        const ch = inputs[0][0];
        if (ch) this.port.postMessage(ch.slice());
        return true;
    }
}
registerProcessor('mic-processor', MicProcessor);
`;

document.getElementById('btn-mic-start').onclick = async () => {
    if (!model) return;
    micReset();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    micCtx = new AudioContext({sampleRate: SR});

    // Load worklet from a blob URL (keeps everything in one HTML file)
    const blob = new Blob([WORKLET_SRC], {type: 'application/javascript'});
    const blobUrl = URL.createObjectURL(blob);
    await micCtx.audioWorklet.addModule(blobUrl);
    URL.revokeObjectURL(blobUrl);

    const src    = micCtx.createMediaStreamSource(stream);
    const worklet = new AudioWorkletNode(micCtx, 'mic-processor');

    // Fix canvas pixel resolution to its actual display size
    micWaveCanvas.width  = micWaveCanvas.offsetWidth;
    micWaveCanvas.height = micWaveCanvas.offsetHeight;

    // AudioWorklet delivers 128-sample blocks; accumulate into STEP-sized chunks
    worklet.port.onmessage = e => {
        if (!micRunning) return;
        drawWaveform(e.data);  // update waveform on every 128-sample block
        const tmp = new Float32Array(micLeftover.length + e.data.length);
        tmp.set(micLeftover); tmp.set(e.data, micLeftover.length);
        micLeftover = tmp;

        while (micLeftover.length >= STEP) {
            const score = processStep(micLeftover.subarray(0, STEP));
            updateMicUI(score);
            micLeftover = micLeftover.slice(STEP);
        }
    };

    src.connect(worklet);
    micRunning=true;
    document.getElementById('btn-mic-start').disabled=true;
    document.getElementById('btn-mic-stop').disabled=false;
};

document.getElementById('btn-mic-stop').onclick = () => {
    micRunning=false;
    if (micCtx) { micCtx.close(); micCtx=null; }
    document.getElementById('btn-mic-start').disabled=false;
    document.getElementById('btn-mic-stop').disabled=true;
    document.getElementById('mic-score').textContent='—';
    document.getElementById('mic-bar').style.width='0%';
    document.getElementById('mic-detected').textContent='';
};
</script>
</body>
</html>
