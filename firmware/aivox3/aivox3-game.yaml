# =============================================================================
# AI-VOX3 "frío / tibio / caliente" GAME (no-audio version).
# Say the active wake word; the DETECTION PROBABILITY decides how "hot" you got:
#   prob < 0.50         -> frío     (LED blue)        no toggle
#   0.50 .. 0.65        -> tibio    (LED amber)       no toggle
#   0.65 .. 0.80        -> caliente (LED red)         no toggle
#   >= 0.80             -> WIN      (LED green) -> TOGGLE the relay + switch word
# The LCD shows a thermometer (fill = probability, colour = tier) + a sun/moon for relay state.
#
# Uses patched micro_wake_word (trigger passes `probability`) via external_components:
#   components/micro_wake_word/ — Trigger<std::string,float>, average_probability/255, float param in __init__.
# Cutoff is LOW (0.3) so weak attempts still fire and read "frío". TUNE the tier
# thresholds below to the `prob=` values you see logged (sliding-AVERAGE prob runs lower
# than max — if WIN never triggers, lower 0.80).
#
# Audio feedback (speaking frío/tibio/caliente) is deferred: the mic<->speaker switch with
# micro_wake_word in the loop is unreliable in ESPHome (see aivox3-audiotest.yaml). Revisit
# with a full-duplex custom component if voice is wanted.
# Flash:  esphome run firmware/aivox3/aivox3-game.yaml
# =============================================================================

external_components:
  - source:
      type: local
      path: components
    components: [micro_wake_word, full_duplex_audio]

esphome:
  name: aivox3-game
  includes:
    - components/game_display/game_display.h
  on_boot:
    - priority: -100
      then:
        - light.turn_on: { id: onboard_led, red: 15%, green: 8%, blue: 0%, brightness: 30%, transition_length: 0s }
        - lambda: |-
            id(es8311_codec).set_mute_off();
            id(es8311_codec).set_volume(0.85f);
        - micro_wake_word.start:
        - micro_wake_word.enable_model: turn_on_model      # deterministic boot: OFF, listen for "turn on"
        - micro_wake_word.disable_model: turn_off_model
        - lambda: |-
            static GameDisplay gd(id(lcd));
            gd.setup();
    # ALC disabled for testing — may hurt mww by introducing time-varying gain artifacts.
    # Re-enable if detection works well without it and you need near/far range.
    # - priority: -200
    #   then:
    #     - lambda: |-
    #         auto *dev = id(bus_a);
    #         const uint8_t addr = 0x18;
    #         uint8_t w[2];
    #         w[0] = 0x17; w[1] = 0xBF; dev->write(addr, w, 2);  // ADC_VOLUME ceiling 0 dB
    #         w[0] = 0x19; w[1] = 0x77; dev->write(addr, w, 2);  // ALC target window
    #         w[0] = 0x18; w[1] = 0xC0; dev->write(addr, w, 2);  // ALC_EN + AUTOMUTE_EN

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

i2c:
  id: bus_a
  sda: GPIO13
  scl: GPIO12
  frequency: 400kHz
  scan: true

audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false          # analog mic via fda/I2S; true changes ADC I2S format, breaks fda
    mic_gain: 30DB

# wifi disabled for testing — re-enable when needed
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

full_duplex_audio:
  id: fda
  mclk_pin: GPIO11
  bclk_pin: GPIO10
  ws_pin: GPIO8
  dout_pin: GPIO7
  din_pin: GPIO9
  sample_rate: 16000
  # upload_url: !secret sample_upload_url   # set to http://<server>:5000/upload to enable

micro_wake_word:
  id: mww
  microphone: fda
  stop_after_detection: false
  models:
    - model: ../models/turn_on.json    # chispa mágica
      id: turn_on_model
      probability_cutoff: 0.30
      sliding_window_size: 2
      internal: true
    - model: ../models/turn_off.json   # buenas noches
      id: turn_off_model
      probability_cutoff: 0.30
      sliding_window_size: 2
      internal: true
  # No on_wake_word_detected — GameDisplay polls get_max_probability() every 100 ms
  # and owns all game logic (thermometer, LED, relay, tones). WIN_THRESH = 0.45 in game_display.h.

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    pin: GPIO41
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    id: lcd_backlight
    output: lcd_bl_output
    internal: true
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: lcd_bl_output
    pin: GPIO16

switch:
  - platform: gpio
    id: relay
    pin: GPIO5
    restore_mode: ALWAYS_OFF

globals:
  - id: scene                      # 1 = relay ON (sun), 2 = relay OFF (moon)
    type: int
    restore_value: no
    initial_value: '2'
  - id: game_prob                  # peak-held probability written by GameDisplay (Core 0)
    type: float
    restore_value: no
    initial_value: '0.0'

font:
  - file: "gfonts://Roboto"
    id: font_prob
    size: 14
    glyphs: "0123456789%"

spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

display:
  - platform: ili9xxx
    model: ST7789V
    id: lcd
    cs_pin: GPIO15
    dc_pin: GPIO14
    dimensions: 240x240
    invert_colors: true
    data_rate: 40MHz
    update_interval: never
    lambda: |-
      auto BG_ON  = Color(0xFF, 0xC0, 0x00);   // warm yellow (relay ON)
      auto SUN    = Color(0xFF, 0x70, 0x00);   // orange
      auto BG_OFF = Color(0x0A, 0x12, 0x40);   // night navy (relay OFF)
      auto MOON   = Color(0xF2, 0xF2, 0xDA);   // pale
      auto WHITE  = Color(0xFF, 0xFF, 0xFF);

      // ---- full-screen scene = relay state (like the original aivox3.yaml) ----
      // centred between the two thermometer strips (46px left | 44px | 60px gap | 44px | 46px right).
      int cx = 120;
      if (id(scene) == 1) {                       // ON -> sun on yellow
        it.fill(BG_ON);
        it.filled_circle(cx, 120, 40, SUN);
        for (int a = 0; a < 360; a += 45) {
          float r = a * 0.01745329f;
          it.line(cx + (int)(cosf(r) * 54), 120 + (int)(sinf(r) * 54),
                  cx + (int)(cosf(r) * 76), 120 + (int)(sinf(r) * 76), SUN);
        }
      } else {                                    // OFF -> crescent moon + stars on navy
        it.fill(BG_OFF);
        it.filled_circle(cx, 118, 46, MOON);
        it.filled_circle(cx + 24, 100, 42, BG_OFF);   // carve the crescent
        it.filled_circle(cx - 34, 44, 2, MOON);       // stars
        it.filled_circle(cx + 46, 64, 3, MOON);
        it.filled_circle(cx + 30, 188, 2, MOON);
        it.filled_circle(cx - 6, 206, 2, MOON);
      }

      // Probability percentage — centred below left thermometer strip (TY+TH=220).
      auto TEXT = (id(scene) == 1) ? Color(0x00, 0x00, 0x00) : Color(0xFF, 0xFF, 0xFF);
      it.printf(5, 224, id(font_prob), TEXT, "%d%%", (int)(id(game_prob) * 100.0f));

      // Thermometer strip is drawn by GameDisplay (Core 0 task) via draw_pixels_at.
