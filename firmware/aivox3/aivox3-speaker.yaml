# =============================================================================
# AI-VOX3 SPEAKER-ONLY TEST — no microphone, so nothing competes for the I2S bus.
#   Press TOP-RIGHT (GPIO0): play a loud 440 Hz tone (~2 s).
#   Press MIDDLE  (GPIO46) : play a rising sweep so you can't mistake it for noise.
#   - Tone audible  -> DAC + NS4150B amp work; the loopback's silence was bus contention with the mic.
#   - Still silent  -> DAC/amp path issue (volume, routing, or PA enable).
# Flash:  esphome run firmware/aivox3-speaker.yaml
# =============================================================================

esphome:
  name: aivox3-speaker
  on_boot:
    priority: -100              # after all components have finished setup()
    then:
      - lambda: |-
          // ESPHome's es8311 setup() never unmutes; the bare speaker won't either.
          id(es8311_codec).set_mute_off();
          id(es8311_codec).set_volume(0.9f);
          ESP_LOGI("spk", "es8311 unmuted, volume set");
      - delay: 300ms
      # Prime the I2S/codec with ~0.2 s of silence so the FIRST real press makes sound
      # (the DAC only wakes once the I2S clock starts running).
      - speaker.play: !lambda 'return std::vector<uint8_t>(6400, 0);'
      - logger.log: "speaker primed"

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: GPIO13
  scl: GPIO12
  frequency: 400kHz
  scan: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO10
    i2s_mclk_pin: GPIO11

audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO7
    dac_type: external
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 3000ms
    timeout: never            # was 500ms -> it stopped playback mid-clip; never = play the whole buffer

binary_sensor:
  - platform: gpio
    id: tone_button
    internal: true
    pin: { number: GPIO0, inverted: true, mode: { input: true, pullup: true } }
    on_press:
      - logger.log: "440 Hz tone -> speaker (loud)"
      - speaker.play: !lambda |-
          std::vector<uint8_t> t;
          for (int i = 0; i < 32000; i++) {                       // 2 s @ 16 kHz
            int16_t s = (int16_t)(20000.0f * sinf(2.0f * 3.14159265f * 440.0f * i / 16000.0f));
            t.push_back((uint8_t)(s & 0xFF));
            t.push_back((uint8_t)((s >> 8) & 0xFF));
          }
          return t;

  - platform: gpio
    id: sweep_button
    internal: true
    pin: { number: GPIO46, inverted: true, mode: { input: true, pullup: true } }
    on_press:
      - logger.log: "rising sweep 300->2000 Hz -> speaker"
      - speaker.play: !lambda |-
          std::vector<uint8_t> t;
          float phase = 0.0f;
          for (int i = 0; i < 32000; i++) {                       // 2 s sweep
            float f = 300.0f + (1700.0f * i / 32000.0f);
            phase += 2.0f * 3.14159265f * f / 16000.0f;
            int16_t s = (int16_t)(18000.0f * sinf(phase));
            t.push_back((uint8_t)(s & 0xFF));
            t.push_back((uint8_t)((s >> 8) & 0xFF));
          }
          return t;
