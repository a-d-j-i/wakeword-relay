# =============================================================================
# Nulllab AI-VOX3 (ESP32-S3 + ES8311 codec + built-in analog mic, 1.54" LCD).
# Wake-word test for chispa magica / buenas noches.
#
# Pins from xiaozhi-esp32/main/boards/nulllab-ai-vox-v3/config.h:
#   I2S  MCLK=11 BCLK=10 WS=8 DOUT(codec)=7 DIN(mic)=9
#   I2C  SDA=13 SCL=12   ES8311 @ 0x18
#   LED  GPIO41 (WS2812)   LCD(ST7789) CLK=17 MOSI=21 CS=15 DC=14 BL=16
#
# FEEDBACK: watch the serial logs ("Detected '...'") AND the onboard LED
#   (boots red; green on "chispa magica", red on "buenas noches").
#
# BRING-UP TIP: if NOTHING ever fires, isolate mic vs model:
#   1. temporarily replace the two models with  `- model: okay_nabu`  and say
#      "okay nabu" — if THAT fires, the mic+codec work and we revisit the models.
#   2. if okay_nabu is also silent, toggle es8311 `use_microphone: true`
#      (analog mic should be false; some units wire a PDM mic).
#
# Flash:  esphome run firmware/aivox3.yaml
# =============================================================================

esphome:
  name: aivox3-wakeword
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: onboard_led
            red: 15%
            green: 8%
            blue: 0%              # dim warm amber (2:1 R:G keeps it orange, not red); low brightness for sleep
            brightness: 30%
            transition_length: 0s
        - component.update: lcd   # draw the boot image (moon = off state)
        - micro_wake_word.start:  # mww does NOT auto-start -- required, or it never listens
        # Force a DETERMINISTIC boot state. mww persists each model's enabled flag to NVS,
        # so without explicitly enabling turn_on_model here, a "turn_on disabled" left over
        # from a previous ON session (or a reflash without erase) keeps okay_nabu dead until
        # you wipe flash. Set BOTH every boot -> boot = OFF, listening only for "turn on".
        - micro_wake_word.enable_model: turn_on_model
        - micro_wake_word.disable_model: turn_off_model
    # Enable the ES8311 hardware ALC (auto level control) AFTER the codec has
    # configured itself (the es8311 component runs at default/-100 priority and
    # would otherwise overwrite these registers). ALC continuously boosts quiet/
    # far speech and limits loud speech -> "adjusts the mic volume by itself".
#    - priority: -200
#      then:
#        - lambda: |-
#            // ES8311 @ 0x18 on bus_a. Write the ADC/record-path ALC registers.
#            auto dev = id(bus_a);
#            const uint8_t addr = 0x18;
#            // 0x17 ADC_VOLUME = max digital gain ALC may apply (0xBF = 0 dB;
#            //      raise toward 0xFF = +32 dB for more boost on far speech)
#            { uint8_t v = 0xBF; dev->write(addr, (const uint8_t[]){0x17, v}, 2); }
#            // 0x19 ALC target window: maxlevel (bits7:4) / minlevel (bits3:0)
#            { uint8_t v = 0x77; dev->write(addr, (const uint8_t[]){0x19, v}, 2); }
#            // 0x18 ALC_EN=1 (bit7), ADC_AUTOMUTE_EN=1 (bit6, suppress silence
#            //      noise-boost), default ALC_WINSIZE -> 0xC0
#            { uint8_t v = 0xC0; dev->write(addr, (const uint8_t[]){0x18, v}, 2); }

esp32:
  board: esp32-s3-devkitc-1   # generic S3 target; AI-VOX3 is 16MB flash / 8MB PSRAM
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz                  # max for octal PSRAM (120MHz is quad-only); CPU already at 240MHz max above

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG   # native-USB board: logs come out /dev/ttyACM*

# --- I2C bus to configure the ES8311 codec --------------------------------
i2c:
  id: bus_a                        # id so the on_boot ALC lambda can write ES8311 registers
  sda: GPIO13
  scl: GPIO12
  frequency: 400kHz
  scan: true                       # logs detected I2C addrs at boot; expect 0x18

# --- I2S bus (ESP32 is master; provides clocks to the codec) ---------------
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO10
    i2s_mclk_pin: GPIO11

# --- ES8311 codec: initialises the ADC/mic path over I2C -------------------
audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false          # analog mic -> keep DMIC off (try true if silent)
    mic_gain: 42DB                 # 6dB steps only (12/18/24/30/36/42). Lower = less clipping/noise; the frontend (PCAN) loudness-normalizes anyway, so more analog gain hurt detection. Dynamic range handled by ES8311 ALC below.

# --- Microphone reads the codec's I2S data line (DIN) ----------------------
microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO9
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

micro_wake_word:
  microphone: mic
  stop_after_detection: false       # keep listening after each detection (relay toggles continuously)
  models:
    # ON = okay_nabu: built-in, trained on a huge dataset -> very robust. Used as the
    # reference to compare against our home-trained Spanish model (buenas noches = OFF).
    - model: alexa #../models/turn_on.json
      id: turn_on_model
      probability_cutoff: 0.4         # baked-in default is 0.97; lowered hard for sensitivity
      internal: true                  # don't persist enabled flag to NVS -> RAM-only (gates pref_.save in streaming_model.cpp)
    # OFF = buenas noches (our Spanish model). Kept small so it coexists with okay_nabu —
    # two full built-ins (okay_nabu + hey_jarvis) overran the inference task and broke ON.
    - model: okay_nabu # ../models/turn_off.json   # buenas noches
      id: turn_off_model
      probability_cutoff: 0.2          # weaker model -> low cutoff. Two-word design makes this safe.
      internal: true                   # don't persist enabled flag to NVS -> RAM-only
  on_wake_word_detected:
    # Only one model is enabled at a time, so the active word's meaning is implied by the
    # current state (scene). Independent of the wake-word STRING -> works for okay_nabu,
    # buenas noches, or any model without editing this handler.
    then:
      - if:
          condition:
            lambda: 'return id(scene) == 2;'   # currently OFF -> this detection is the "turn on" word
          then:
            - light.turn_on: { id: onboard_led, red: 0%, green: 100%, blue: 0%, transition_length: 0s }
            - lambda: 'id(scene) = 1;'         # 1 = sun (ON)
            - component.update: lcd
            - switch.turn_on: relay
            # Light is now ON -> only listen for "turn off" (one model at a time)
            - micro_wake_word.disable_model: turn_on_model
            - micro_wake_word.enable_model: turn_off_model
          else: # currently ON -> this detection is the "turn off" word
            - light.turn_on: { id: onboard_led, red: 15%, green: 8%, blue: 0%, brightness: 30%, transition_length: 0s }
            - lambda: 'id(scene) = 2;'         # 2 = moon (OFF) — dim warm amber, gentle for sleep
            - component.update: lcd
            - switch.turn_off: relay
            # Light is now OFF -> only listen for "turn on"
            - micro_wake_word.disable_model: turn_off_model
            - micro_wake_word.enable_model: turn_on_model

# --- Onboard WS2812 RGB LED + LCD backlight (feedback) ---------------------
light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    pin: GPIO41
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true
    restore_mode: ALWAYS_OFF       # don't persist/restore color from NVS; on_boot + handlers set it explicitly
  - platform: monochromatic        # LCD backlight on GPIO16, on at boot
    id: lcd_backlight
    output: lcd_bl_output
    internal: true
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    id: lcd_bl_output
    pin: GPIO16

# --- Relay on the PH2.0 4-pin expansion connector (board item #11) ----------
#     Connector pins: G -> module GND, 5V -> module VCC (USB VBUS), 5 -> IN.
#     Use an opto-isolated relay MODULE (has transistor+flyback+opto built in).
#     Boots OFF to match the "moon" state; chispa magica closes it, buenas opens it.
switch:
  - platform: gpio
    id: relay
    pin: GPIO5
    restore_mode: ALWAYS_OFF        # boot OFF to match the moon state; ALWAYS_OFF (not RESTORE_*) avoids NVS writes on every toggle -> stops NVS filling/degrading over reflashes

# --- Scene state for the LCD: 1 = sun (chispa magica), 2 = moon (buenas noches)
globals:
  - id: scene
    type: int
    restore_value: no
    initial_value: '2'             # boot shows the moon (off state) = display self-test

# --- 1.54" ST7789 LCD, 240x240. RESET is NC, so use the mipi_spi driver
#     (reset_pin optional there; st7789v driver would require it). -----------
spi:
  clk_pin: GPIO17
  mosi_pin: GPIO21

display:
  - platform: mipi_spi
    model: ST7789V
    id: lcd
    cs_pin: GPIO15
    dc_pin: GPIO14
    dimensions:
      width: 240
      height: 240
    invert_colors: true            # ST7789 IPS panels are usually inverted; flip if colors look wrong
    data_rate: 40MHz
    update_interval: never         # redrawn only on boot + on each wake word
    lambda: |-
      auto BG_ON  = Color(0xFF, 0xC0, 0x00);   // warm yellow
      auto SUN    = Color(0xFF, 0x70, 0x00);   // orange
      auto BG_OFF = Color(0x0A, 0x12, 0x40);   // night navy
      auto MOON   = Color(0xF2, 0xF2, 0xDA);   // pale
      if (id(scene) == 1) {                    // chispa magica -> sun
        it.fill(BG_ON);
        it.filled_circle(120, 120, 42, SUN);
        for (int a = 0; a < 360; a += 45) {
          float r = a * 0.01745329f;
          it.line(120 + (int)(cosf(r) * 58), 120 + (int)(sinf(r) * 58),
                  120 + (int)(cosf(r) * 82), 120 + (int)(sinf(r) * 82), SUN);
        }
      } else {                                 // buenas noches -> crescent moon
        it.fill(BG_OFF);
        it.filled_circle(120, 118, 52, MOON);
        it.filled_circle(146, 100, 46, BG_OFF);  // carve the crescent
        it.filled_circle(55, 55, 2, MOON);       // stars
        it.filled_circle(190, 70, 3, MOON);
        it.filled_circle(80, 185, 2, MOON);
        it.filled_circle(175, 175, 2, MOON);
      }
