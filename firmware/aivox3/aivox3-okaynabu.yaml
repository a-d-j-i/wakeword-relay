# =============================================================================
# AI-VOX3 WAKE-WORD PIPELINE TEST with the known-good okay_nabu model.
# Mic path is confirmed working; this isolates "our Spanish models" from
# "the whole micro_wake_word pipeline on this board".
#   Say "okay nabu":
#     LED flashes GREEN + log "Detected 'okay_nabu'"  -> pipeline works; issue is our models/threshold
#     nothing ever                                     -> mww frontend/level issue (raise mic_gain, etc.)
# mic_gain raised to 24DB (micmon showed only ~6% FS at 12DB).
# Flash:  esphome run firmware/aivox3-okaynabu.yaml
# =============================================================================

esphome:
  name: aivox3-okaynabu
  on_boot:
    priority: -100
    then:
      - light.turn_on: { id: onboard_led, red: 100%, green: 0%, blue: 0%, transition_length: 0s }
      - micro_wake_word.start:      # <-- mww does NOT auto-start; this was the whole problem

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: GPIO13
  scl: GPIO12
  frequency: 400kHz
  scan: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO10
    i2s_mclk_pin: GPIO11

audio_dac:
  - platform: es8311
    id: es8311_codec
    address: 0x18
    sample_rate: 16000
    bits_per_sample: 16bit
    use_mclk: true
    use_microphone: false
    mic_gain: 30DB             # ~50% FS at normal speech (12DB was ~6%); 42DB clipped

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO9
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

micro_wake_word:
  microphone: mic
  stop_after_detection: false  # keep listening so you can test repeatedly
  models:
    - model: okay_nabu        # downloaded from the esphome models repo at compile time
      probability_cutoff: 0.5  # override the baked-in 0.97 -> if it fires now, it was threshold/level
  on_wake_word_detected:
    then:
      - light.turn_on: { id: onboard_led, red: 0%, green: 100%, blue: 0%, transition_length: 0s }
      - delay: 1s
      - light.turn_on: { id: onboard_led, red: 100%, green: 0%, blue: 0%, transition_length: 0s }

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    pin: GPIO41
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true

# Heartbeat: is micro_wake_word actually running and consuming the mic?
interval:
  - interval: 5s
    then:
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - logger.log: "[alive] micro_wake_word is RUNNING"
          else:
            - logger.log: "[alive] micro_wake_word is STOPPED"
