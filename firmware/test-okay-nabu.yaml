# =============================================================================
# MIC / PIPELINE TEST — prebuilt okay_nabu model.
# Boots BLUE (so you can tell this build apart from the main RED-boot config).
# Say "okay nabu": LED flashes WHITE for 2s, then back to BLUE.
#   - LED flashes white  -> mic + I2S + inference + LED all work.
#   - Nothing ever fires -> mic/I2S wiring or config problem (not the models).
# Flash:  esphome run firmware/test-okay-nabu.yaml
# =============================================================================

esphome:
  name: mic-test
  on_boot:
    then:
      - light.turn_on:
          id: onboard_led
          red: 0%
          green: 0%
          blue: 100%

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG               # prints "Detected 'okay_nabu' ... probability ..." on each hit
  hardware_uart: USB_SERIAL_JTAG   # route app logs to the native USB (/dev/ttyACM0)

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO6   # WS / LRCL
    i2s_bclk_pin: GPIO5    # SCK / BCLK

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO7     # SD / DOUT from the mic
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: right    # TEMP TEST: was 'left'. If okay_nabu now works, your INMP441 L/R pin isn't tied to GND.

micro_wake_word:
  microphone: mic
  models:
    - model: okay_nabu    # downloaded from the esphome models repo at compile time
  on_wake_word_detected:
    then:
      - light.turn_on:
          id: onboard_led
          red: 100%
          green: 100%
          blue: 100%
      - delay: 2s
      - light.turn_on:
          id: onboard_led
          red: 0%
          green: 0%
          blue: 100%

light:
  - platform: esp32_rmt_led_strip
    id: onboard_led
    pin: GPIO48           # GPIO38 on older DevKitC-1 revisions
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    internal: true
